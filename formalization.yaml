automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5.5"
      framework: "Claude Code"
  notes: >-
    Claude Code proposed the problem, wrote the linear programs that found the functions, searched the literature,
    wrote all of the Lean code and drafted these metadata. The human author directed the work and is responsible for
    the submission.

review:
  status: "unchecked"
  notes: >-
    No separate human review of the Lean code has been made before submission. Mechanical checks: a build without
    warnings other than the placeholders of Challenge.lean, the axioms of the four results are propext,
    Classical.choice and Quot.sound, and a separate program outside Lean checked the inequalities in every window.

status:
  scope: >-
    The values for n = 3, 4 and 5 and for still Lifes. The values for n = 0, 1, 2, 6, 7 and 8, which are in the papers
    cited, are not treated.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - description: "The greatest upper density of a set whose points have at most three neighbours in it is 1/2."
      declaration: "LatticeDensity.isGreatest_upperDensity_three"
      file: "LatticeDensity/Three.lean"
      comparator_config: "comparator.json"
