fidelity:
  notes: >-
    The neighbours are the eight lattice points closest to a point, and the upper density is the limit superior of the
    proportion of the box of the points with both coordinates less than r in absolute value, as in Section 1 of
    Elkies's paper. The value for r = 0 is 0/0 = 0 and does not matter for the limit. A still Life is a fixed set of
    Conway's rule B3/S23, finite or not. The correspondence with the finite boards of Ionascu, Pritikin and Wright is
    not formalized.

