    - description: "The greatest upper density of a still Life is 1/2."
      declaration: "LatticeDensity.isGreatest_upperDensity_stillLife"
      file: "LatticeDensity/Three.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - description: "The greatest upper density of a set whose points have at most four neighbours in it is 3/5."
      declaration: "LatticeDensity.isGreatest_upperDensity_four"
      file: "LatticeDensity/Four.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - description: "The greatest upper density of a set whose points have at most five neighbours in it is 9/13."
      declaration: "LatticeDensity.isGreatest_upperDensity_five"
      file: "LatticeDensity/Five.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
