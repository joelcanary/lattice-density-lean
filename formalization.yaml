    - source: "arXiv:math/9905194, Section 1: the still-Life conjecture, with the example that attains the bound"
      lean: "LatticeDensity.isGreatest_upperDensity_stillLife"
      module: "Solution"
      status: "proved"
    - source: "arXiv:math/0608140, the conjectured value 3/5 for k = 4, for sets in the whole lattice"
